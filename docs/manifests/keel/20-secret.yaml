# Keel secret — holds the Basic Auth password for the Admin UI and API.
#
# PLACEHOLDER — replace the value below with your own password before applying.
# Do NOT commit real credentials to this file. Prefer creating the secret out of
# band, for example:
#
#   kubectl -n keel create secret generic keel \
#     --from-literal=BASIC_AUTH_PASSWORD='your-password'
#
# Values in `data` are base64-encoded. Encode a plaintext password with:
#
#   echo -n 'your-password' | base64
#
# The 'YWRtaW4K' below decodes to "admin" and exists only so the manifest set
# applies cleanly out of the box.
#
# Keel requires BASIC_AUTH_USER and BASIC_AUTH_PASSWORD to be set together or
# both unset. BASIC_AUTH_USER lives in 30-deployment.yaml. To run without Basic
# Auth, delete this Secret *and* remove BASIC_AUTH_USER plus the envFrom block
# from 30-deployment.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: keel
  namespace: keel
type: Opaque
data:
  # PLACEHOLDER: base64-encoded Basic Auth password.
  BASIC_AUTH_PASSWORD: YWRtaW4K
